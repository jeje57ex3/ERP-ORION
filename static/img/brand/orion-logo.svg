  <text x="78" y="29"
        font-family="Poppins, Inter, 'Segoe UI', system-ui, sans-serif"
        font-weight="700"
        font-size="19"
        fill="#2B1808"
        letter-spacing="1.5">ORION</text>
  <text x="78" y="48"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-weight="500"
