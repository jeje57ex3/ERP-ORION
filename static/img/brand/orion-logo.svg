<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 64" fill="none" role="img" aria-label="Orion ERP">
  <!-- Geometric icon mark (60×60) -->

  <!-- Brown "L" shape: left arm + bottom arm -->
