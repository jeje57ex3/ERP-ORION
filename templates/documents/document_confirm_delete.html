{% extends "erp_base.html" %}
{% load i18n %}
{% block content %}
<div class="delete-confirm-card erp-card p-4 text-center">
  <div class="delete-confirm-icon"><i class="bi bi-exclamation-triangle"></i></div>
  <h4 class="mb-2">{% trans "Supprimer ce document ?" %}</h4>
  <p class="fw-semibold fs-5 mb-3">{{ doc.title }}</p>
  <div class="orion-alert danger text-start mb-4">
    <i class="bi bi-exclamation-circle me-2"></i><strong>{% trans "Attention !" %}</strong> {% trans "Le fichier associé sera également supprimé. Cette action est irréversible." %}
  </div>
  <form method="post" class="d-flex gap-2 justify-content-center">
    {% csrf_token %}
    <a href="{% url 'documents:document_detail' doc.pk %}" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-1"></i>{% trans "Annuler" %}</a>
    <button type="submit" class="orion-btn danger"><i class="bi bi-trash me-1"></i>{% trans "Supprimer" %}</button>
  </form>
</div>
{% endblock %}
