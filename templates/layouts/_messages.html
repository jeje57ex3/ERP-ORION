{% if messages %}
<div class="orion-messages" style="margin-bottom:18px;display:flex;flex-direction:column;gap:8px">
  {% for message in messages %}
  <div class="orion-alert orion-alert-{{ message.tags|default:'info' }}" role="alert"
       style="display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;border:1px solid;font-size:13px">
    <i class="bi bi-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' or message.tags == 'danger' %}exclamation-triangle{% elif message.tags == 'warning' %}exclamation-circle{% else %}info-circle{% endif %}" aria-hidden="true"></i>
    <span style="flex:1">{{ message }}</span>
    <button onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;opacity:.6;font-size:16px;padding:0;line-height:1" aria-label="Fermer">×</button>
  </div>
  {% endfor %}
</div>
{% endif %}
