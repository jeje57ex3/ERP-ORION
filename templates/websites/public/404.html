{% if site %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — {{ site.name }}</title>
  <meta name="robots" content="noindex">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #f8fafc; color: #1e293b;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .card { background: #fff; border-radius: 1rem; padding: 3rem 2.5rem; max-width: 480px; width: 100%; text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .num { font-size: 6rem; font-weight: 900; color: #e2e8f0; line-height: 1; }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 0.5rem 0 1rem; }
    p { color: #64748b; }
    a.btn { display: inline-block; margin-top: 1.5rem; padding: 0.75rem 1.5rem; background: #2563eb; color: #fff;
      text-decoration: none; border-radius: 0.5rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="num">404</div>
    <h1>Cette page est introuvable.</h1>
    <p>La page que vous recherchez n'existe pas ou a été déplacée.</p>
    <a href="/" class="btn">Retour à l'accueil</a>
  </div>
</body>
</html>
{% else %}
<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>404 — Introuvable</title></head>
<body style="font-family:sans-serif;text-align:center;padding:4rem">
  <h1>404 — Page introuvable</h1>
  <p>La page demandée n'existe pas.</p>
  <a href="/">Retour à l'accueil</a>
</body>
</html>
{% endif %}
