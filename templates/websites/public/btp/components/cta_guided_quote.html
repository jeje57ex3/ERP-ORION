{% load static i18n %}
<section class="site-section-sm">
  <div class="site-container">
    <div class="site-cta-banner site-reveal">
      <span class="site-h-label" style="color:rgba(255,255,255,.85)"><i class="bi bi-tools" aria-hidden="true"></i> {% trans 'Votre projet' %}</span>
      <h2 class="site-h-xxl">{% trans 'Vous avez un projet de travaux ?' %}</h2>
      <p>{% trans "Répondez à quelques questions et recevez une première estimation personnalisée. C'est gratuit et sans engagement." %}</p>
      <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem">
        <a href="{% url 'guided_quote:wizard_start' %}" class="site-btn site-btn-accent site-btn-lg">
          <span class="site-btn-label"><i class="bi bi-pencil-square" aria-hidden="true"></i>{% trans 'Démarrer mon devis guidé' %}</span>
        </a>
        <a href="{% url 'public_websites:btp_contact' site.public_slug %}" class="site-btn site-btn-outline" style="border-color:rgba(255,255,255,.4);color:#fff">
          <span class="site-btn-label"><i class="bi bi-chat-text" aria-hidden="true"></i>{% trans 'Nous contacter' %}</span>
        </a>
      </div>
    </div>
  </div>
</section>
