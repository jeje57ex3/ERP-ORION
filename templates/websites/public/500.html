{% load i18n %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% trans "Erreur serveur" %}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #f8fafc; color: #1e293b;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .card { background: #fff; border-radius: 1rem; padding: 3rem 2.5rem; max-width: 480px; width: 100%; text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .num { font-size: 6rem; font-weight: 900; color: #fee2e2; line-height: 1; }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 0.5rem 0 1rem; }
    p { color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="num">500</div>
    <h1>{% trans "Une erreur est survenue." %}</h1>
    <p>{% trans "Veuillez réessayer plus tard. Si le problème persiste, contactez l'administrateur du site." %}</p>
  </div>
</body>
</html>
