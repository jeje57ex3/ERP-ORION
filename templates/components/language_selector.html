{% load i18n %}
{# Selecteur de langue ERP — a inclure dans la navbar ou le profil utilisateur #}
<form action="{% url 'set_language' %}" method="post" class="language-selector d-inline-flex align-items-center gap-1">
  {% csrf_token %}
  <input name="next" type="hidden" value="{{ request.get_full_path }}">
  {% get_current_language as CURRENT_LANGUAGE %}
  {% get_available_languages as AVAILABLE_LANGUAGES %}
  <select name="language" class="form-select form-select-sm" onchange="this.form.submit()"
          aria-label="{% trans 'Changer la langue' %}" style="max-width:140px">
    {% for code, name in AVAILABLE_LANGUAGES %}
      <option value="{{ code }}" {% if code == CURRENT_LANGUAGE %}selected{% endif %}>
        {{ name }}
      </option>
    {% endfor %}
  </select>
</form>
