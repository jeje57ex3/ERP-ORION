{% extends "erp_base.html" %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{% url 'accounting:dashboard' %}">Comptabilité</a></li>
<li class="breadcrumb-item"><a href="{% url 'accounting:journal_list' %}">Journaux</a></li>
<li class="breadcrumb-item active">Nouveau journal</li>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="erp-card">
      <div class="erp-orion-orion-card-header"><h6 class="erp-card-title"><i class="bi bi-journal-plus me-2"></i>Nouveau journal</h6></div>
      <div class="erp-orion-orion-card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Code <span class="text-danger">*</span></label>
            <input type="text" name="code" class="form-control" required placeholder="ex. ACH" style="text-transform:uppercase">
            <div class="form-text">2-5 caractères, sera mis en majuscules.</div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Libellé <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required placeholder="ex. Journal des achats">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Type <span class="text-danger">*</span></label>
            <select name="journal_type" class="form-select" required>
              {% for val, label in type_choices %}
              <option value="{{ val }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="orion-btn primary"><i class="bi bi-check-lg me-1"></i>Créer</button>
            <a href="{% url 'accounting:journal_list' %}" class="btn btn-outline-secondary">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
