{% extends "erp_base.html" %}
{% load i18n %}
{% block content %}
<div class="delete-confirm-card erp-card p-4 text-center">
  <div class="delete-confirm-icon"><i class="bi bi-exclamation-triangle"></i></div>
  <h4 class="mb-2">{% trans "Supprimer cette compétence ?" %}</h4>
  <p class="fw-semibold fs-5 mb-3">{{ skill.name }}</p>
  <form method="post" class="d-flex gap-2 justify-content-center">
    {% csrf_token %}
    <a href="{% url 'hr:employee_detail' skill.employee.pk %}" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-1"></i>{% trans "Annuler" %}</a>
    <button type="submit" class="orion-btn danger"><i class="bi bi-trash me-1"></i>{% trans "Supprimer" %}</button>
  </form>
</div>
{% endblock %}
