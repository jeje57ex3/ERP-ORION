{% extends "erp_base.html" %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{% url 'hr:private_folder_list' %}">Dossiers privés</a></li>
<li class="breadcrumb-item"><a href="{% url 'hr:private_folder_detail' employee.pk %}">{{ employee.first_name }} {{ employee.last_name }}</a></li>
<li class="breadcrumb-item active">Ajouter un document</li>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="erp-card">
      <div class="erp-orion-orion-card-header"><h6 class="erp-card-title"><i class="bi bi-file-earmark-plus me-2"></i>Nouveau document confidentiel</h6></div>
      <div class="erp-orion-orion-card-body">
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Titre <span class="text-danger">*</span></label>
            <input type="text" name="title" class="form-control" required>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Type de document <span class="text-danger">*</span></label>
              <select name="document_type" class="form-select" required>
                {% for val, label in doc_type_choices %}
                <option value="{{ val }}">{{ label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Confidentialité <span class="text-danger">*</span></label>
              <select name="confidentiality_level" class="form-select" required>
                {% for val, label in confidentiality_choices %}
                <option value="{{ val }}" {% if val == 'confidential' %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Fichier <span class="text-danger">*</span></label>
            <input type="file" name="file" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Date d'expiration</label>
            <input type="date" name="expires_at" class="form-control" style="max-width:220px">
          </div>
          <div class="mb-3 d-flex gap-4">
            <div class="form-check form-switch">
              <input type="checkbox" name="visible_to_employee" class="form-check-input" id="visibleCheck">
              <label class="form-check-label" for="visibleCheck">Visible par le salarié</label>
            </div>
            <div class="form-check form-switch">
              <input type="checkbox" name="requires_signature" class="form-check-input" id="sigCheck">
              <label class="form-check-label" for="sigCheck">Nécessite une signature</label>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="orion-btn primary"><i class="bi bi-check-lg me-1"></i>Ajouter</button>
            <a href="{% url 'hr:private_folder_detail' employee.pk %}" class="btn btn-outline-secondary">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
