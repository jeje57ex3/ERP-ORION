{% extends "erp_base.html" %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{% url 'access_control:dashboard' %}">Contrôle d'accès</a></li>
<li class="breadcrumb-item"><a href="{% url 'access_control:override_list' %}">Overrides</a></li>
<li class="breadcrumb-item active">Nouvel override</li>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="erp-card">
      <div class="erp-orion-orion-card-header"><h6 class="erp-card-title"><i class="bi bi-sliders me-2"></i>Nouvel override de permission</h6></div>
      <div class="erp-orion-orion-card-body">
        <form method="post" action="{% url 'access_control:override_create' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Utilisateur <span class="text-danger">*</span></label>
            <select name="user_id" class="form-select" required>
              <option value="">-- Sélectionner --</option>
              {% for access in users %}
              <option value="{{ access.user.pk }}">{{ access.user.get_full_name|default:access.user.username }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Module <span class="text-danger">*</span></label>
            <select name="module_code" class="form-select" required>
              <option value="">-- Sélectionner --</option>
              {% for mod in modules %}
              <option value="{{ mod.code }}">{{ mod.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Action (laisser vide = module entier)</label>
            <select name="action_code" class="form-select">
              <option value="">-- Toutes les actions --</option>
              {% for act in actions %}
              <option value="{{ act.code }}">{{ act.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Effet <span class="text-danger">*</span></label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input type="radio" name="allowed" value="1" class="form-check-input" id="allowYes" checked>
                <label class="form-check-label text-success fw-semibold" for="allowYes">Autoriser</label>
              </div>
              <div class="form-check">
                <input type="radio" name="allowed" value="0" class="form-check-input" id="allowNo">
                <label class="form-check-label text-danger fw-semibold" for="allowNo">Refuser</label>
              </div>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Raison / justification</label>
            <textarea name="reason" class="form-control" rows="2" placeholder="Optionnel, pour audit"></textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="orion-btn primary"><i class="bi bi-check-lg me-1"></i>Créer</button>
            <a href="{% url 'access_control:override_list' %}" class="btn btn-outline-secondary">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
