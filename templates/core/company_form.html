{% extends "erp_base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-10">
    <div class="card erp-card">
      <div class="orion-orion-card-header"><h5 class="card-title mb-0">{{ page_title }}</h5></div>
      <div class="orion-orion-card-body">
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="orion-btn primary"><i class="bi bi-check me-1"></i>Enregistrer</button>
            <a href="{% url 'core:company_list' %}" class="btn btn-outline-secondary">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
