<!DOCTYPE html>
<html lang="fr" data-bs-theme="light" data-theme="light" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{{ brand_name|default:"Orion ERP" }}{% endblock %} — {{ brand_name|default:"Orion ERP" }}</title>
  {% load static %}
  <link rel="icon" type="image/svg+xml" href="{% static 'img/brand/orion-icon.svg' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/brand/orion-icon.svg' %}">
  <link rel="apple-touch-icon" href="{% static 'img/brand/orion-icon.svg' %}">
  <!-- Anti-FOUC : apply saved theme before CSS renders -->
  <script>
    (function(){
      var t = localStorage.getItem('orion-theme') || 'light';
      if(t === 'system') t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-bs-theme', t);
    })();
  </script>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- ERP CSS -->
  <link href="{% static 'css/erp.css' %}" rel="stylesheet">
  <!-- Orion ERP brand -->
  <link href="{% static 'css/orion.css' %}" rel="stylesheet">
  <!-- Orion Design System (dark mode, compact mode, components) -->
  <link href="{% static 'css/orion-design-system.css' %}" rel="stylesheet">
  <!-- Orion Desktop Design System (v1) -->
  <link href="{% static 'css/orion-desktop.css' %}" rel="stylesheet">
  <link href="{% static 'css/orion-sidebar.css' %}" rel="stylesheet">
  <link href="{% static 'css/orion-forms.css' %}" rel="stylesheet">
  <link href="{% static 'css/orion-tabs.css' %}" rel="stylesheet">
  <!-- Orion Desktop UI (v2 — layout, sidebar, forms, tables, tabs) -->
  <link href="{% static 'css/orion-desktop-layout.css' %}" rel="stylesheet">
  <link href="{% static 'css/orion-desktop-sidebar.css' %}" rel="stylesheet">
  <link href="{% static 'css/orion-desktop-forms.css' %}" rel="stylesheet">
  <link href="{% static 'css/orion-desktop-tables.css' %}" rel="stylesheet">
  <link href="{% static 'css/orion-desktop-tabs.css' %}" rel="stylesheet">
  <!-- Orion ERP v3 — design sobre & professionnel -->
  <link href="{% static 'css/orion-layout.css' %}" rel="stylesheet">
  <link href="{% static 'css/orion-components.css' %}" rel="stylesheet">
  <link href="{% static 'css/orion-tables.css' %}" rel="stylesheet">
  <link href="{% static 'css/orion-dashboard.css' %}" rel="stylesheet">
  <link href="{% static 'css/orion-responsive.css' %}" rel="stylesheet">

  {% block extra_css %}{% endblock %}
</head>
<body class="orion-desktop">
{% block body %}{% endblock %}

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- ERP JS -->
<script src="{% static 'js/erp.js' %}"></script>
<!-- Orion UI (keyboard shortcuts, toast, command palette, dark mode) -->
<script src="{% static 'js/orion-ui.js' %}"></script>
<!-- Orion Desktop v1 -->
<script src="{% static 'js/orion-desktop.js' %}"></script>
<!-- Orion Desktop UI v2 -->
<script src="{% static 'js/orion-desktop-ui.js' %}"></script>
<!-- Orion ERP v3 — design sobre -->
<script src="{% static 'js/orion-sidebar.js' %}"></script>
<script src="{% static 'js/orion-tabs.js' %}"></script>
<script src="{% static 'js/orion-toast.js' %}"></script>
<script src="{% static 'js/orion-dropdown.js' %}"></script>
<script src="{% static 'js/orion-command-palette.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
