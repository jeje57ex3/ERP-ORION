{% load dashboard_tags %}
{% with data=widget_data|dict_get:"quick_actions" %}
<div class="widget-header"><i class="{{ user_widget.widget.icon }} me-2" style="color:{{ user_widget.widget.color }}"></i>{{ user_widget.get_display_title }}</div>
<div class="d-flex flex-wrap gap-2 p-3">
  {% if data.actions %}
    {% for action in data.actions %}
    <a href="{{ action.url }}" class="btn btn-sm d-flex align-items-center gap-1 px-3 py-2 rounded-3 text-white fw-semibold" style="background:{{ action.color }};font-size:.8rem">
      <i class="{{ action.icon }}"></i>{{ action.label }}
    </a>
    {% endfor %}
  {% else %}
    <p class="text-muted small mb-0 p-2">Aucune action configurée.</p>
  {% endif %}
</div>
{% endwith %}
