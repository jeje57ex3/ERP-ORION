{% load dashboard_tags %}
{% with data=widget_data|dict_get:"ecommerce_abandoned_carts" %}
<div class="widget-header"><i class="{{ user_widget.widget.icon }} me-2" style="color:{{ user_widget.widget.color }}"></i>{{ user_widget.get_display_title }}</div>
<div class="widget-empty-state py-4">
  <i class="bi bi-cart-x text-muted"></i>
  <p class="mt-2 mb-0">Module paniers abandonnés non activé.</p>
  <p class="text-muted" style="font-size:.75rem">{{ data.note|default:"Fonctionnalité à venir." }}</p>
</div>
{% endwith %}
