<div class="card erp-card">
  <div class="card-header d-flex align-items-center gap-2">
    <i class="bi bi-graph-down-arrow text-success"></i>
    <h6 class="mb-0">{{ widget_title }}</h6>
  </div>
  <div class="card-body p-0">
    {% if changes %}
    <ul class="list-group list-group-flush">
      {% for alert in changes %}
      <li class="list-group-item">
        <div class="small fw-semibold">{{ alert.title|truncatechars:50 }}</div>
        <div class="text-muted" style="font-size:.7rem">
          {{ alert.competitor.name }} · {{ alert.created_at|date:"d/m H:i" }}
        </div>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p class="text-muted text-center py-3 mb-0">Aucun changement de prix récent</p>
    {% endif %}
  </div>
</div>
