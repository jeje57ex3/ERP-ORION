upstream orion_backend {
    server orion-backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/orion_access.log main;
    error_log /var/log/nginx/orion_error.log warn;

    # Fichiers statiques Django (admin, etc.)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Fichiers media — RELAYES VERS DJANGO, et non servis depuis le disque.
    #
    # Ce bloc portait « alias /var/www/media/; », avec « access_log off ».
    # Nginx servait donc les fichiers televerses sans authentification, sans
    # jamais atteindre apps/core/media_access.py:servir_media -- la vue qui
    # applique un refus par defaut et tient employee_private/ (contrats,
    # bulletins de paie, pieces d'identite), bank_statements/,
    # supplier_invoices/ et expense_receipts/ hors de /media/ -- et sans
    # meme laisser de trace de la lecture.
    #
    # Ce `server` ecoute sur « server_name _ », c'est-a-dire qu'il repond a
    # n'importe quel Host : c'etait le bloc par defaut de l'appliance.
    #
    # Le cache de 7 jours est retire avec l'alias : la vue decide elle-meme
    # « public » ou « private » selon le prefixe, et un en-tete pose ici
    # aurait laisse un fichier interne dans le cache partage d'un proxy.
    location /media/ {
        proxy_pass http://orion_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend SIÈCLE — SPA React
    location /siecle/ {
        root /var/www/static;
        try_files $uri $uri/ /siecle/index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Assets buildés SIÈCLE (JS/CSS avec hash — cachables longtemps)
    location ~* ^/siecle/assets/ {
        root /var/www/static;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Frontend LUNEA — SPA React
    location /lunea/ {
        root /var/www/static;
        try_files $uri $uri/ /lunea/index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Assets buildés LUNEA
    location ~* ^/lunea/assets/ {
        root /var/www/static;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Websockets / SSE (si nécessaire)
    location /ws/ {
        proxy_pass http://orion_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Backend Django
    location / {
        proxy_pass http://orion_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
