upstream orion_backend {
    server orion-backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/orion_access.log main;
    error_log /var/log/nginx/orion_error.log warn;

    # Fichiers statiques Django (admin, etc.)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Fichiers media
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Frontend SIÈCLE — SPA React
    location /siecle/ {
        root /var/www/static;
        try_files $uri $uri/ /siecle/index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Assets buildés SIÈCLE (JS/CSS avec hash — cachables longtemps)
    location ~* ^/siecle/assets/ {
        root /var/www/static;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Frontend LUNEA — SPA React
    location /lunea/ {
        root /var/www/static;
        try_files $uri $uri/ /lunea/index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Assets buildés LUNEA
    location ~* ^/lunea/assets/ {
        root /var/www/static;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Websockets / SSE (si nécessaire)
    location /ws/ {
        proxy_pass http://orion_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Backend Django
    location / {
        proxy_pass http://orion_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
