# Orion ERP Appliance — Cloudflare Tunnel ingress.
# Le tunnel n'est démarré (05-cloudflared-config.sh, via `cloudflared service
# install <token>`) que si un token a été fourni au déploiement. Ce fichier
# n'est copié qu'à titre de référence (config.yml.tmpl) — l'installation par
# token gère l'ingress depuis le dashboard Cloudflare Zero Trust, pas ce
# fichier local.

tunnel: __TUNNEL_NAME__
credentials-file: /etc/cloudflared/__TUNNEL_ID__.json

ingress:
  - hostname: __LOGIN_DOMAIN__
    service: http://127.0.0.1:9000
  - hostname: __ORION_DOMAIN__
    service: http://127.0.0.1:5172
  - hostname: __SIECLE_DOMAIN__
    service: http://127.0.0.1:5173
  - hostname: __LUNEA_DOMAIN__
    service: http://127.0.0.1:5174
  - service: http_status:404
