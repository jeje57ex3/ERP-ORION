# Orion ERP — le tunnel Cloudflare doit se relever seul.
#
# POURQUOI UN FRAGMENT ET NON UNE UNITE.
#
# cloudflared.service est installe par cloudflared lui-meme (« cloudflared
# service install »), pas par ce depot. On ne le remplace donc pas : systemd
# lit /etc/systemd/system/cloudflared.service.d/*.conf PAR-DESSUS l'unite
# d'origine, et une mise a jour de cloudflared n'ecrase pas ce fragment.
#
# CE QUI EST ARRIVE LE 09/11/2026.
#
# L'acces a l'ERP a ete perdu parce que le tunnel etait tombe et que RIEN ne
# le relevait. La seule reprise automatique de l'appliance etait
# orion-health.timer, qui redemarrait toutes les 60 secondes tout service
# qu'il jugeait en panne -- sans delai de grace, donc sans jamais laisser au
# tunnel le temps d'etablir ses quatre connexions QUIC, ce qui prend vingt a
# trente secondes. Le tunnel ne se stabilisait jamais. Il a fallu arreter
# cette garde, et l'arreter a supprime le filet.
#
# Un tunnel n'a pas besoin d'un gardien qui le surveille de l'exterieur. Il
# a besoin de savoir se relever, et systemd sait faire cela mieux qu'un
# script lance par un minuteur.

[Unit]
# Vingt tentatives sur dix minutes, large a dessein.
#
# Le defaut de systemd est de CINQ tentatives sur DIX SECONDES : une
# coupure d'acces Internet de trente secondes suffit a l'epuiser, apres
# quoi systemd abandonne definitivement et le tunnel reste mort jusqu'a une
# intervention humaine. C'est exactement la situation ou personne ne peut
# intervenir, puisque l'acces passe par ce tunnel.
#
# Avec vingt essais espaces de quinze secondes, le tunnel insiste pendant
# cinq minutes avant de renoncer -- assez pour traverser une coupure
# reseau, pas assez pour tourner en boucle indefiniment sur une
# configuration reellement fausse.
StartLimitIntervalSec=600
StartLimitBurst=20

[Service]
# « always » et non « on-failure » : un tunnel qui se termine PROPREMENT
# doit repartir aussi. L'edge Cloudflare ferme parfois la session de son
# cote, et cloudflared sort alors avec un code nul -- « on-failure » le
# laisserait arrete, sans aucune erreur pour l'expliquer.
Restart=always

# Quinze secondes, et non la seconde par defaut. Redemarrer trop vite
# pendant une coupure reseau epuise la limite ci-dessus avant que le reseau
# ne revienne.
RestartSec=15
